name: Vérifications Moneta
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run build:edge
      - run: node --check app/app.js && node --check app/data.js && node --check app/accounts.js && node --check app/plus.js
      - name: Installer Chromium pour les parcours navigateur
        run: |
          npm install --prefix "$RUNNER_TEMP/moneta-browser" --no-save --package-lock=false playwright@1.62.1 @electric-sql/pglite@0.5.16
          "$RUNNER_TEMP/moneta-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Tester les parcours complets
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/moneta-browser/node_modules/playwright
          PGLITE_MODULE: ${{ runner.temp }}/moneta-browser/node_modules/@electric-sql/pglite
        run: |
          python -m http.server 8080 > "$RUNNER_TEMP/moneta-http.log" 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8080/app/ --output /dev/null
          node --test tests/database.cjs
          node tests/browser.cjs
          MONETA_MOCK_AUTH=1 node tests/accounts.browser.cjs
          node tests/plus-ci.browser.cjs
          node tests/account-security.browser.cjs
